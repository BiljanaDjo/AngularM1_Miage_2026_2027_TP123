@if (snackbar.current(); as data) {
  <aside
    class="snackbar"
    [class.success]="data.type === 'success'"
    [class.error]="data.type === 'error'"
    [class.info]="data.type === 'info'"
    [attr.role]="data.type === 'error' ? 'alert' : 'status'"
    aria-live="polite"
  >
    <div class="snackbar-content">
      <span class="snackbar-icon" aria-hidden="true">
        @if (data.type === 'success') { ✅ }
        @else if (data.type === 'error') { ⚠️ }
        @else { ℹ️ }
      </span>
      <span class="snackbar-message">{{ data.message }}</span>
    </div>
    <button
      type="button"
      class="snackbar-close"
      (click)="snackbar.dismiss()"
      aria-label="Fermer la notification"
    >
      ✕
    </button>
  </aside>
}
