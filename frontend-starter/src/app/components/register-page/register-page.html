<section class="card">
  <h1>Créer un compte</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nom
      <input type="text" formControlName="name" autocomplete="name" />
      @if (form.controls.name.touched && form.controls.name.errors?.['required']) {
        <small class="error" role="alert">Le nom est obligatoire.</small>
      }
    </label>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.errors?.['required']) {
        <small class="error" role="alert">L’email est obligatoire.</small>
      }
      @if (form.controls.email.touched && form.controls.email.errors?.['email']) {
        <small class="error" role="alert">Format d’email invalide.</small>
      }
    </label>
    <label>
      Mot de passe
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.errors?.['required']) {
        <small class="error" role="alert">Le mot de passe est obligatoire.</small>
      }
      @if (form.controls.password.touched && form.controls.password.errors?.['minlength']) {
        <small class="error" role="alert">Le mot de passe doit comporter au moins 8 caractères.</small>
      }
    </label>
    <button type="submit" [disabled]="form.invalid">Créer mon compte</button>
  </form>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <p><a routerLink="/login">Déjà inscrit ?</a></p>
</section>
