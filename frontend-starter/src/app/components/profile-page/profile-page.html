<section class="card">
  <h1>Mon profil</h1>

  @if (loading() && !auth.currentUser()) {
    <p>Chargement du profil...</p>
  }

  @if (auth.currentUser(); as user) {
    <p>
      <b>{{ user.name }}</b><br />
      {{ user.email }}<br />
      <small>Membre depuis le {{ user.createdAt.slice(0, 10) }}</small>
    </p>

    <form [formGroup]="form" (ngSubmit)="save()">
      <label>
        Nom complet
        <input type="text" formControlName="name" autocomplete="name" />
        @if (form.controls.name.touched && form.controls.name.errors?.['required']) {
          <small class="error" role="alert">Le nom est obligatoire.</small>
        }
        @if (form.controls.name.touched && form.controls.name.errors?.['minlength']) {
          <small class="error" role="alert">Le nom doit comporter au moins 2 caractères.</small>
        }
      </label>
      <button type="submit" [disabled]="form.invalid || loading()">
        @if (loading()) {
          Enregistrement...
        } @else {
          Enregistrer les modifications
        }
      </button>
    </form>
  }

  @if (success()) {
    <p class="success" role="status">{{ success() }}</p>
  }

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
</section>
